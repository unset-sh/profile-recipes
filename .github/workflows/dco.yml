# The DCO check: every commit a pull request adds must carry a "Signed-off-by:" line, the contributor's statement
# under the Developer Certificate of Origin (https://developercertificate.org) that the work is theirs to give.
# Pull requests from the owner and from bots are exempt. The rules are in scripts/dco.ts; CONTRIBUTING.md says what
# contributors do.
#
# It runs on `pull_request`, so a fork's run gets a read-only token and no secrets, and installs no package. Beyond
# GitHub's own checkout it uses only oven-sh/setup-bun, pinned by commit, to run the check script. The job name "DCO"
# is the check to require in the "Protect main" ruleset.

name: dco

on:
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dco:
    name: DCO
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      # Full history, so both the base and the head commit of the pull request are present.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
          no-cache: true
          token: ""
      - name: Bun is the pinned version
        run: test "$(bun --version)" = "$(cat .bun-version)"
      - name: Check every commit is signed off
        run: bun scripts/dco-check.ts
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
