name: validate

on:
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]
  push:
    branches: [staging, main]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, test and validate recipes
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
          no-cache: true
          token: ""
      - name: Bun is the pinned version
        run: test "$(bun --version)" = "$(cat .bun-version)"
      - run: test -f bun.lock && bun install --frozen-lockfile --ignore-scripts
      - run: bun run check
      - name: Render the showcase pages
        run: bun run render
      - name: Prepare the documentation export without publishing
        run: bun scripts/docs-export.ts "$RUNNER_TEMP/docs-export"
