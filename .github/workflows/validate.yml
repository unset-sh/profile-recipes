name: validate

# Calls tooling's shared check, the single source of truth for how organisation repositories run CI.
# Pinned to a full tooling commit; docs/use-workflows.md in unset-sh/tooling describes the inputs.

on:
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]
  push:
    branches: [staging, main]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, test and validate recipes
    uses: unset-sh/tooling/.github/workflows/ci-check.yml@cbc0732281b48db638da554fe163d156e64f9066
    permissions:
      contents: read
      packages: read # the shared install step may read @unset-sh packages; profile-recipes has none today
    with:
      install: true
      # After the check: render the showcase pages, and prepare the documentation export without publishing.
      command: |
        bun run check
        bun run render
        bun scripts/docs-export.ts "$RUNNER_TEMP/docs-export"
